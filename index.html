<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 60px;
      display: flex;
      justify-content: space-between;
    }

    .left-column {
      max-width: 50%;
    }

    h1, p {
      margin: 0 0 20px 0;
      white-space: pre;
    }

    .project-link {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s ease;
      cursor: pointer;
      font-size: 18px;
    }

    .project-link:hover {
      color: #6aff00;
      text-decoration: none;
    }

    .project-block {
      display: block;
      margin-bottom: 20px;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
    }

    .socials a {
      text-decoration: none;
      color: white;
      transition: color 0.2s ease;
    }

    .socials a:hover {
      color: #aaf;
    }

    .email-button {
      margin-top: 20px;
      background: #666;
      color: white;
      border: none;
      padding: 8px 16px;
      font-family: inherit;
      cursor: pointer;
    }

    #preview {
      width: 400px;
      height: 300px;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.3s ease, width 0.3s ease, height 0.3s ease;
    }
  </style>
</head>
<body>
  <canvas id="laserCanvas"></canvas>

  <div class="content">
    <div class="left-column">
      <h1>oceane serrat</h1>
      <p>interactive & game designer</p>
      <p>based in geneva</p>

      <br><br>

      <!-- Liens de projets stylisés -->
      <p class="project-link project-block" data-image="/portfolio2025/img/roots.jpg">↗ roots</p>
      <a href="https://delusionalsouvenirs.cc/" target="_blank" class="project-link project-block" data-image="/portfolio2025/img/delusional.jpeg" data-ratio="portrait">↗ delusional souvenirs</a>
      <p class="project-link project-block" data-image="/portfolio2025/img/degrade.jpg">↗ degrade</p>
      <p class="project-link project-block" data-image="/portfolio2025/img/savethegoblin.png" data-ratio="portrait">↗ save the goblin</p>
      <p class="project-link project-block" data-image="/portfolio2025/img/baterylow.jpg">↗ battery low</p>
      <br>

      <div class="socials">
        <a href="https://oceanesrt.itch.io/" target="_blank">itch.io</a>
        <a href="https://github.com/oserratr" target="_blank">github</a>
        <a href="https://www.linkedin.com/in/oceane-serrat/" target="_blank">linkedin</a>
        <a href="/portfolio2025/about.html">about me</a>
      </div>

      <button class="email-button" onclick="copyEmail()">copy email address</button>
    </div>

    <!-- Aperçu image -->
    <div id="preview"></div>
  </div>

  <script>
    function copyEmail() {
      navigator.clipboard.writeText("oceane.srt77@gmail.com");
    }

    const preview = document.getElementById('preview');
    const links = document.querySelectorAll('.project-link');

    links.forEach(link => {
      link.addEventListener('mouseenter', () => {
        const img = link.dataset.image;
        const ratio = link.dataset.ratio;

        preview.style.backgroundImage = `url(${img})`;
        preview.style.opacity = 1;

        // Changement du ratio si data-ratio="portrait"
        if (ratio === "portrait") {
          preview.style.width = "300px";
          preview.style.height = "400px";
        } else {
          preview.style.width = "400px";
          preview.style.height = "300px";
        }
      });

      link.addEventListener('mouseleave', () => {
        preview.style.opacity = 0;
      });
    });

    const canvas = document.getElementById('laserCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let points = [];

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    document.addEventListener('mousemove', e => {
      points.push({ x: e.clientX, y: e.clientY, alpha: 1.0 });
    });

    function animate() {
      ctx.fillStyle = 'rgba(17, 17, 17, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];
        ctx.strokeStyle = `rgba(173, 255, 47, ${p1.alpha})`;
        ctx.lineWidth = 2;
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
      }
      ctx.stroke();

      for (let p of points) p.alpha -= 0.015;
      points = points.filter(p => p.alpha > 0);

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
